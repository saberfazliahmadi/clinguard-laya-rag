name: ClinGuard-RAG CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Run Ruff linter and Mypy type checker
        run: |
          ruff check src tests scripts
          PYTHONPATH=src:. mypy src scripts

      - name: Run pytest suite with coverage
        run: |
          PYTHONPATH=src:. pytest -v --cov=clinguard_rag --cov-report=term-missing --cov-fail-under=85

      - name: Run deterministic evaluation benchmark and CLI smoke check
        run: |
          PYTHONPATH=src:. python scripts/run_evaluation.py
          PYTHONPATH=src:. python scripts/demo_cli.py --case-id EVAL-03 --mode clinguard_full

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.lock

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the test image
        run: |
          docker build -t clinguard-rag:ci .
          docker run --rm clinguard-rag:ci
