name: ClinGuard-RAG Parity & Evaluation CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit and integration test suite
        run: |
          python -m pytest -v
        env:
          PYTHONPATH: src:.

      - name: Verify reproducible ablation benchmark & CLI audit output
        run: |
          python scripts/run_evaluation.py
          python scripts/demo_cli.py --case-id EVAL-03 --mode clinguard_full
        env:
          PYTHONPATH: src:.