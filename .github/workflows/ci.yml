name: ClinGuard-RAG CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter and Mypy type checker
        run: |
          ruff check src tests scripts
          PYTHONPATH=src mypy src

      - name: Run pytest suite with coverage
        run: |
          PYTHONPATH=src:. pytest -v --cov=clinguard_rag --cov-report=term-missing

      - name: Run deterministic evaluation benchmark and CLI smoke check
        run: |
          PYTHONPATH=src:. python scripts/run_evaluation.py
          PYTHONPATH=src:. python scripts/demo_cli.py --case-id EVAL-03 --mode clinguard_full
