[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinguard-laya-rag"
version = "0.1.0"
description = "Calibrated System-1 Decision Layer (Laya / Jev) for Healthcare RAG"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "ClinGuard-RAG Engineering"}]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.5.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.26.0",
]

[project.optional-dependencies]
laya = [
    "laya>=0.4.8",
    "torch>=2.1.0",
    "transformers>=4.48.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]